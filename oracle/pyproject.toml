[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wl-oracle"
version = "0.1.0"
description = "Sundial metric oracle: the executable specification of the metric engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }

[project.scripts]
wl-oracle = "wl_oracle.cli:main"

[tool.setuptools]
packages = ["wl_oracle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
